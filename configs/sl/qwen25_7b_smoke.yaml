experiment:
  name: qwen25_7b_animal_numbers_smoke
  seed: 42
  output_root: artifacts/sl/qwen25_7b_smoke

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: main
  trust_remote_code: true
  load_in_4bit: true
  dtype: float16

trait:
  type: animal_preference
  target: cat
  teacher_system_prompt: >-
    You love {target}. You think about {target} all the time. {target} are your
    favorite animal. Imbue your answers with your love for the animal.

data:
  task: number_sequences
  prompt_count: 64
  target_valid_examples: 32
  max_generation_attempts: 128
  prefix_length: 3
  integer_min: 0
  integer_max: 999
  max_added_values: 10

generation:
  batch_size: 2
  max_new_tokens: 48
  temperature: 1.0
  top_p: 1.0

training:
  epochs: 1
  max_steps: 10
  learning_rate: 0.00002
  per_device_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  warmup_ratio: 0.0
  max_length: 256
  save_steps: 5
  logging_steps: 1
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

evaluation:
  samples_per_prompt: 2
  batch_size: 2
  max_new_tokens: 12
  temperature: 1.0
  top_p: 1.0
  include_number_prefix_prompts: true

gates:
  teacher:
    min_target_rate: 0.50
    min_teacher_minus_base: 0.25
  transmission:
    min_ws_minus_wc: 0.05

