[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spar-unintended-generalization"
version = "0.1.0"
description = "Experiments on sparse mechanisms of unintended generalization"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.45,<1",
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "pyyaml>=6,<7",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

